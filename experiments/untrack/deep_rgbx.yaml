DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
    - DepthTrack_train
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 60000 # 60000
  VAL:
    DATASETS_NAME:
    - DepthTrack_val
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 10000 # 10000
MODEL:
  # ==================================================================================================================================================
  PRETRAIN_FILE: 'E:\Pycharm_Project\Algorithm_Challenge_Competition\Vision_Geometry_Semantic\UnTrack_Joint_T_P_search\pretrained\OSTrack_ep0300.pth.tar' # OSTrack_ep0300.pth.tar
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce_prompt
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  VISUAL:
    BACKBONE: 'swin_base_patch4_window7_224_in22k'
    # ==========================================================================================================================
    PRETRAINED_PATH: 'E:\Pycharm_Project\Algorithm_Challenge_Competition\Vision_Geometry_Semantic\UnTrack_Joint_T_P_search\pretrained\swin_transformer\swin_base_patch4_window7_224_22k.pth' # swin_base_patch4_window7_224_22k.pth
  LANGUAGE:
    TYPE: 'bert-base-uncased'
    # =========================================================================================================================
    PATH: 'E:\Pycharm_Project\Algorithm_Challenge_Competition\Vision_Geometry_Semantic\UnTrack_Joint_T_P_search\pretrained\bert\bert-base-uncased' # bert-base-uncased
    # =========================================================================================================================
    VOCAB_PATH: 'E:\Pycharm_Project\Algorithm_Challenge_Competition\Vision_Geometry_Semantic\UnTrack_Joint_T_P\pretrained\bert\bert-base-uncased\vocab.txt' # bert-base-uncased\vocab.txt
    BERT:
      LR: 0.00001
      ENC_NUM: 12
      HIDDEN_DIM: 768
      MAX_QUERY_LEN: 40
  VL:
    HIDDEN_DIM: 768
    DROPOUT: 0.1
    NHEAD: 8
    DIM_FEEDFORWARD: 1024
    ENC_LAYERS: 6
    NORM_BEFORE: False
    USE_VIS_CLS: False
    USE_VIS_SEP: True
    ACTIVATION: 'GELU'
    INIT: 'trunc_norm'
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 4  # candidate elimination start epoch 1/15
  CE_WARM_EPOCH: 16  # candidate elimination warm up epoch 4/15
  BATCH_SIZE: 48 #32
  EPOCH: 80
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 48
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
  PROMPT:
    TYPE: deep
  FIX_BN: true
  SAVE_EPOCH_INTERVAL: 5
  SAVE_LAST_N_EPOCH: 1
TEST:
  EPOCH: 60
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
